<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>
<div style="width:100%;background:#232B2B;border-radius:0 0 20px 20px;padding:8px 8px 10px;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;user-select:none">
  <sc-if value="{{ hasNotice }}" hint-placeholder-val="{{ false }}">
    <div style="background:#2C3736;border-radius:12px;padding:12px 14px;margin-bottom:8px;border-left:3px solid {{ noticeRule }}">
      <div style="font-size:13px;font-weight:600;color:#F5F3EA">{{ noticeTitle }}</div>
      <div style="font-size:12px;line-height:17px;color:#A9B0AC;margin-top:3px">{{ noticeBody }}</div>
    </div>
  </sc-if>
  <sc-if value="{{ isDemo }}" hint-placeholder-val="{{ false }}">
    <div style="background:#2C3736;border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:16px;line-height:24px;color:#F5F3EA">
      <span>Meeting moved to Thursday. </span><span style="display:inline-grid;position:relative"><span style="grid-area:1/1;opacity:{{ originalOpacity }};padding-bottom:4px">{{ demoOriginal }}</span><span style="grid-area:1/1;opacity:{{ correctedOpacity }};padding-bottom:4px">{{ demoCorrected }}</span><span style="position:absolute;left:0;bottom:0;height:2px;background:{{ underlineColor }};width:{{ underlineWidth }};opacity:{{ underlineOpacity }};transition:width 150ms ease-out, background-color 200ms ease-out, opacity 200ms ease-out"></span></span><span> going to the store to pick up dinner.</span>
    </div>
  </sc-if>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <div style="flex:1;height:44px;background:#2C3736;border-radius:20px;display:flex;align-items:center;justify-content:space-around;padding:0 14px;min-width:0">
      <sc-if value="{{ hasSuggestions }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="3">
          <span style="font-size:15px;color:#F5F3EA;font-weight:{{ s.weight }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.text }}</span>
        </sc-for>
      </sc-if>
      <sc-if value="{{ noSuggestions }}" hint-placeholder-val="{{ true }}">
        <span style="font-size:14px;color:#A9B0AC;font-style:italic">Suggestions appear here</span>
      </sc-if>
    </div>
    <sc-if value="{{ showGrammar }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ handleTap }}" style="width:44px;height:44px;border-radius:22px;border:none;background:{{ grammarBg }};color:{{ grammarColor }};font-size:18px;font-weight:600;flex-shrink:0;cursor:pointer" style-hover="opacity:0.85">✓</button>
    </sc-if>
    <sc-if value="{{ showAI }}" hint-placeholder-val="{{ false }}">
      <button style="width:44px;height:44px;border-radius:22px;border:none;background:{{ aiBg }};color:{{ aiColor }};font-size:17px;flex-shrink:0;cursor:pointer" style-hover="opacity:0.85">✦</button>
    </sc-if>
  </div>

  <div style="display:flex;gap:4px;margin-bottom:4px">
    <sc-for list="{{ row1 }}" as="k" hint-placeholder-count="10">
      <div style="flex:1;height:44px;background:#34403F;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#F5F3EA;font-size:18px" style-hover="background:#3E4C4B">{{ k }}</div>
    </sc-for>
  </div>
  <div style="display:flex;gap:4px;margin-bottom:4px;padding:0 18px">
    <sc-for list="{{ row2 }}" as="k" hint-placeholder-count="9">
      <div style="flex:1;height:44px;background:#34403F;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#F5F3EA;font-size:18px" style-hover="background:#3E4C4B">{{ k }}</div>
    </sc-for>
  </div>
  <div style="display:flex;gap:4px;margin-bottom:4px">
    <div style="flex:1.5;height:44px;background:{{ shiftKeyBg }};border-radius:8px;display:flex;align-items:center;justify-content:center;color:{{ shiftKeyColor }};font-size:18px">{{ shiftGlyph }}</div>
    <sc-for list="{{ row3 }}" as="k" hint-placeholder-count="7">
      <div style="flex:1;height:44px;background:#34403F;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#F5F3EA;font-size:18px" style-hover="background:#3E4C4B">{{ k }}</div>
    </sc-for>
    <div style="flex:1.5;height:44px;background:#2C3736;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#F5F3EA;font-size:18px">⌫</div>
  </div>
  <div style="display:flex;gap:4px">
    <div style="flex:1.3;height:44px;background:#2C3736;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#A9B0AC;font-size:14px;font-weight:500">{{ modeLabel }}</div>
    <div style="flex:1;height:44px;background:#34403F;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#F5F3EA;font-size:18px">,</div>
    <div style="flex:5;height:44px;background:#34403F;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#A9B0AC;font-size:12px;letter-spacing:1px">ENGLISH (US)</div>
    <div style="flex:1;height:44px;background:#34403F;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#F5F3EA;font-size:18px">.</div>
    <div style="flex:1.6;height:44px;background:#2C3736;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#F5F3EA;font-size:14px;font-weight:500">return</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:290},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;qwerty&quot;,&quot;options&quot;:[&quot;qwerty&quot;,&quot;symbols&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;shiftMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;shift&quot;,&quot;caps&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;suggestions&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;grammarButton&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;idle&quot;,&quot;demo&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;aiButton&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;idle&quot;,&quot;active&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;demoOriginal&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;demoCorrected&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;noticeTitle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;noticeBody&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;noticeSeverity&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;neutral&quot;,&quot;options&quot;:[&quot;neutral&quot;,&quot;failure&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { phase: 'idle' };

  handleTap = () => {
    // Only the demo frame has a sentence to redraw. In the idle frames the key is
    // shown "ready", and tapping it must not repaint the key on its own — the colour
    // change is the tail of a correction, never a press state.
    if (this.props.grammarButton !== 'demo') return;
    if (this.state.phase !== 'idle') return;
    this.setState({ phase: 'underline' });
    setTimeout(() => this.setState({ phase: 'crossfade' }), 150);
    setTimeout(() => this.setState({ phase: 'settle' }), 250);
    setTimeout(() => this.setState({ phase: 'done' }), 450);
    setTimeout(() => this.setState({ phase: 'idle' }), 1600);
  };

  renderVals() {
    const p = this.props;
    const layout = p.layout ?? 'qwerty';
    const shiftMode = p.shiftMode ?? 'none';
    const isCaps = shiftMode === 'caps';
    const isShift = shiftMode === 'shift' || isCaps;

    const qwerty = [['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']];
    const symbols = [['1','2','3','4','5','6','7','8','9','0'],['-','/',':',';','(',')','$','&','@'],['#+=','.',',','?','!',"'"]];
    const rows = layout === 'symbols' ? symbols : qwerty;
    const caseRows = rows.map(row => row.map(k => (layout === 'qwerty' && isShift) ? k.toUpperCase() : k));

    const suggestions = (p.suggestions || []).map((t, i) => ({ text: t, weight: i === 0 ? 600 : 400 }));
    const phase = this.state.phase;
    const originalOpacity = (phase === 'crossfade' || phase === 'settle' || phase === 'done') ? 0 : 1;
    const correctedOpacity = 1 - originalOpacity;
    const underlineWidth = phase === 'idle' ? '0%' : '100%';
    const underlineColor = (phase === 'settle' || phase === 'done') ? '#E8C468' : '#E2725B';
    const underlineOpacity = phase === 'done' ? 0 : (phase === 'idle' ? 0 : 1);

    const grammarButton = p.grammarButton ?? 'none';
    const aiButton = p.aiButton ?? 'none';

    return {
      row1: caseRows[0], row2: caseRows[1], row3: caseRows[2],
      modeLabel: layout === 'symbols' ? 'ABC' : '123',
      hasSuggestions: suggestions.length > 0,
      noSuggestions: suggestions.length === 0,
      suggestions,
      showGrammar: grammarButton !== 'none',
      grammarBg: '#2C3736',
      grammarColor: (phase === 'done') ? '#E8C468' : '#A9B0AC',
      showAI: aiButton !== 'none',
      aiBg: aiButton === 'active' ? '#5B9279' : '#2C3736',
      aiColor: aiButton === 'active' ? '#F5F3EA' : '#A9B0AC',
      // An IME cannot draw into the host app's text field, so a notice about a tier
      // being down is rendered in the panel the keyboard owns — the same slot the
      // correction sequence uses. FAILURE takes the coral rule, NEUTRAL the muted one.
      hasNotice: !!p.noticeTitle,
      noticeTitle: p.noticeTitle ?? '',
      noticeBody: p.noticeBody ?? '',
      noticeRule: p.noticeSeverity === 'failure' ? '#E2725B' : '#A9B0AC',
      isDemo: grammarButton === 'demo',
      demoOriginal: p.demoOriginal ?? 'Their',
      demoCorrected: p.demoCorrected ?? "They're",
      originalOpacity, correctedOpacity, underlineWidth, underlineColor, underlineOpacity,
      handleTap: this.handleTap,
      // Caps lock is a different glyph, not the same glyph in a different colour:
      // the state has to survive a greyscale screenshot.
      shiftGlyph: isCaps ? '⇪' : '⇧',
      shiftKeyBg: isCaps ? '#E8C468' : '#2C3736',
      shiftKeyColor: isCaps ? '#232B2B' : (isShift ? '#E8C468' : '#F5F3EA'),
    };
  }
}

</script>
</body>
</html>
